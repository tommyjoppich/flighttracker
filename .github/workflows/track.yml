name: Track flight prices

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Check prices
        run: python tracker.py

      - name: Build report
        id: report
        run: python analyze.py

      - name: Save results
        run: |
          git config user.name  "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Price check $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --quiet
          git push

      - name: Alert on new low
        if: steps.report.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "✈️ New low: \$${{ steps.report.outputs.price }} for ORD⇄DFW" \
            --body-file alert.md
